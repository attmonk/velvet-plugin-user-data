name: Release Package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment to release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

env:
  ATTMONK_CI_EMAIL: '342793482+attmonk-ci[bot]@users.noreply.github.com'

permissions:
  contents: read

concurrency:
  group: release-package-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Get an attmonk-ci token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: 5324952
          private-key: ${{ secrets.ATTMONK_CI_APPKEY || secrets.ATTMONK_CI_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure release identity
        run: |
          git config user.name 'attmonk-ci'
          git config user.email "$ATTMONK_CI_EMAIL"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify package
        run: |
          npm run type-check
          npm test
          npm run build
          npm pack --dry-run

      - name: Create release commit and tag
        id: version
        run: |
          npm version '${{ inputs.bump }}' -m 'chore(release): %s'
          echo "tag=$(git describe --tags --exact-match)" >> "$GITHUB_OUTPUT"

      - name: Build release assets
        id: package
        run: |
          package_file=$(npm pack --json | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(input)[0].filename));")
          sha256sum "$package_file" > "$package_file.sha256"
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tag
        run: |
          git push origin HEAD:main
          git push origin --tags

      - name: Create GitHub Release
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.package.outputs.package_file }}" \
            "${{ steps.package.outputs.package_file }}.sha256" \
            --verify-tag \
            --generate-notes
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
